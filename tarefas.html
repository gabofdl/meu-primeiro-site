<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    padding: 40px 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a5f);
    color: #f8fafc;
    min-height: 100vh;
}
        .container {
    max-width: 550px;
    margin: 30px auto;
    padding: 30px;
    background: #111c30;
    border: 1px solid #334155;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
}

        h1 {
            color: #38bdf8;
            text-align: center;
        }

        .entrada {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .adicionar {
            background: #38bdf8;
            color: #0f172a;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding: 14px;
            background: #1e293b;
            border-radius: 8px;
        }

        li span {
            overflow-wrap: anywhere;
        }

        li.concluida span {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .remover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Minha Lista de Tarefas</h1>

        <div class="entrada">
            <input id="tarefa" type="text" placeholder="Digite uma tarefa...">
            <button class="adicionar" onclick="adicionarTarefa()">Adicionar</button>
        </div>
<p id="contador">Pendentes: 0 | Concluídas: 0</p>
        <ul id="lista"></ul>
    </div>

    <script>
        
        const campo = document.getElementById("tarefa");
        const lista = document.getElementById("lista");
        const contador = document.getElementById("contador");

function atualizarContador() {
    const tarefas = lista.querySelectorAll("li");
    const concluidas = lista.querySelectorAll("li.concluida");

    contador.textContent =
        `Pendentes: ${tarefas.length - concluidas.length} | Concluídas: ${concluidas.length}`;
}
        function salvarTarefas() {
            atualizarContador();
    const tarefas = [];

    lista.querySelectorAll("li").forEach(function(item) {
        tarefas.push({
            texto: item.querySelector("span").textContent,
            concluida: item.classList.contains("concluida")
        });
    });

    localStorage.setItem("minhasTarefas", JSON.stringify(tarefas));
}

        function adicionarTarefa() {
            const texto = campo.value.trim();

            if (texto === "") {
                alert("Digite uma tarefa primeiro!");
                return;
            }

            const item = document.createElement("li");
            const nome = document.createElement("span");
            const concluir = document.createElement("button");
            const remover = document.createElement("button");

            nome.textContent = texto;
            concluir.textContent = "Concluir";
            remover.textContent = "X";

            concluir.onclick = function () {
                item.classList.toggle("concluida");
                salvarTarefas();
                atualizarContador();
            };

            remover.onclick = function () {
                item.remove();
                salvarTarefas();
            };

            item.append(nome, concluir, remover);
            lista.appendChild(item);
            salvarTarefas();

            campo.value = "";
            campo.focus();
        }

        campo.addEventListener("keydown", function (evento) {
            if (evento.key === "Enter") {
                adicionarTarefa();
            }
        });
        function carregarTarefas() {
    const tarefas = JSON.parse(
        localStorage.getItem("minhasTarefas") || "[]"
    );

    tarefas.forEach(function(tarefa) {
        campo.value = tarefa.texto;
        adicionarTarefa();
        atualizarContador();

        const item = lista.lastElementChild;

        if (tarefa.concluida) {
            item.classList.add("concluida");
        }salvarTarefas();
    });

    campo.value = "";
}

carregarTarefas();
    </script>

</body>
</html>
